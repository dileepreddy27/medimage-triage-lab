name: CPU research workflow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: medimage demo --out work/ci-demo --epochs 2
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-research-demo
          path: |
            work/ci-demo/dashboard.html
            work/ci-demo/dashboard.json
            work/ci-demo/metrics.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t medimage .
      - run: docker run --rm medimage demo --out /tmp/smoke --epochs 1
