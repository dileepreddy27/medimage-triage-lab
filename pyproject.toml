[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medimage-triage-lab"
version = "0.1.0"
description = "Synthetic DICOM ingestion, 3D segmentation and auditable research queue"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4", "torch==2.6.0", "torchvision==0.21.0", "monai==1.4.0", "pydicom==3.0.1", "Pillow==11.1.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[project.scripts]
medimage = "medimage.cli:main"

[tool.setuptools.packages.find]
include = ["medimage*"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
